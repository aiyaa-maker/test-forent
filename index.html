            showToast("กำลังอัปโหลดรูปภาพ... ⏳");
            
            const fileExt = file.name.split('.').pop() || 'jpg';
            const fileName = `${Date.now()}_${Math.floor(Math.random()*1000)}.${fileExt}`;
            const filePath = `uploads/${fileName}`;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    canvas.toBlob(async (blob) => {
                        const { data, error } = await supabase.storage.from('shop-images').upload(filePath, blob, { contentType: file.type || 'image/jpeg' });
                        if (error) {
                            showToast("อัปโหลดไม่สำเร็จ: " + error.message);
                            return;
                        }
                        const { data: publicUrlData } = supabase.storage.from('shop-images').getPublicUrl(filePath);

                        showToast("อัปโหลดรูปลงระบบสำเร็จ! ✅");
                    }, file.type || 'image/jpeg', 0.8);
                };
                img.src = event.target.result;
            };

        function BannerCarousel({ banners }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [touchStart, setTouchStart] = useState(0);
            const [touchEnd, setTouchEnd] = useState(0);

            useEffect(() => {
                if (banners.length <= 1) return;
                const interval = setInterval(() => {
                    setCurrentIndex((prev) => (prev + 1) % banners.length);
                }, 4000);
                return () => clearInterval(interval);
            }, [banners]);

            const handleTouchStart = (e) => setTouchStart(e.targetTouches[0].clientX);
            const handleTouchMove = (e) => setTouchEnd(e.targetTouches[0].clientX);
            const handleTouchEnd = () => {
                if (touchStart - touchEnd > 50) setCurrentIndex((prev) => (prev + 1) % banners.length);
                if (touchStart - touchEnd < -50) setCurrentIndex((prev) => (prev - 1 + banners.length) % banners.length);
            };

            if (!banners || banners.length === 0) return null;

            return (
                <div 
                    className="w-full aspect-[2/1] carousel-container bg-pink-50 relative group"
                    onTouchStart={handleTouchStart}
                    onTouchMove={handleTouchMove}
                    onTouchEnd={handleTouchEnd}
                >
                    <div className="carousel-track" style={{ transform: `translateX(-${currentIndex * 100}%)` }}>
                        {banners.map((url, idx) => (
                            <div key={idx} className="carousel-slide shrink-0">
                                <img src={url} className="carousel-img" alt={`banner-${idx}`} />
                            </div>
                        ))}
                    </div>
                    {banners.length > 1 && (
                        <div className="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5 z-10">
                            {banners.map((_, idx) => (
                                <div key={idx} onClick={() => setCurrentIndex(idx)} className={`h-2 rounded-full transition-all cursor-pointer shadow-sm ${idx === currentIndex ? 'bg-[var(--primary)] w-5' : 'bg-white/80 w-2 hover:bg-white'}`} />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

            const [form, setForm] = useState(p);
            const [tagsInput, setTagsInput] = useState(p.tags && p.tags.length > 0 ? p.tags.join(', ') : '');

            const save = () => {
                const finalForm = { ...form, id: isNew ? Date.now() : form.id, tags: tagsInput.split(',').map(t=>t.trim()).filter(t=>t) };
                setDb(prev => ({
                    ...prev, products: isNew ? [finalForm, ...prev.products] : prev.products.map(item => item.id === form.id ? finalForm : item)
                }));
                close();
            };

            const del = () => {
                if(confirm("ยืนยันที่จะลบรหัสนี้?")) {
                    setDb(prev => ({ ...prev, products: prev.products.filter(item => item.id !== form.id) }));
                    close();
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-24 animate-fade-in relative z-[100]">

                            <div><label className="text-[13px] font-bold text-gray-500">ชื่อรหัส</label><input type="text" className="w-full border-2 border-gray-100 p-3 rounded-xl text-[14px] mt-1 font-bold focus:border-[var(--primary)] outline-none transition-colors" value={form.name} onChange={e=>setForm({...form, name:e.target.value})} /></div>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-[13px] font-bold text-gray-500">หมวดหมู่เกม</label>
                                    <select className="w-full border-2 border-gray-100 p-3 rounded-xl text-[14px] mt-1 font-bold focus:border-[var(--primary)] outline-none transition-colors" value={form.category} onChange={e=>setForm({...form, category:e.target.value})}>
                                        {(db.categories || []).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                    </select>
                                </div>
                                <div><label className="text-[13px] font-bold text-gray-500">สถานะปัจจุบัน</label>
                                    <select className="w-full border-2 border-[var(--primary)]/30 p-3 rounded-xl text-[14px] mt-1 bg-pink-50/30 font-bold focus:border-[var(--primary)] outline-none transition-colors text-[var(--primary)]" value={form.status} onChange={e=>setForm({...form, status:e.target.value})}>
                                        {(db.statuses || ['ว่าง', 'ติดคิวเช่า', 'ขายแล้ว']).map(st => (
                                            <option key={st} value={st}>{st}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                            
                            <div className="p-4 rounded-2xl bg-gray-50 border border-gray-100">
                                <label className="text-[13px] font-bold text-[var(--primary)] mb-2 block"><i className="fa-solid fa-tag"></i> ประเภทการให้บริการ</label>
                                <div className="flex gap-4">
                                    <label className="flex items-center gap-2 text-[14px] font-bold cursor-pointer"><input type="radio" checked={form.type==='rent'} onChange={()=>setForm({...form, type:'rent'})} className="w-4 h-4 accent-[var(--primary)]"/> ปล่อยเช่า</label>
                                    <label className="flex items-center gap-2 text-[14px] font-bold cursor-pointer text-red-500"><input type="radio" checked={form.type==='sell'} onChange={()=>setForm({...form, type:'sell'})} className="w-4 h-4 accent-red-500"/> ขายขาด</label>
                                </div>
                            </div>

                            {form.type === 'rent' ? (
                                <div className="grid grid-cols-3 gap-3 bg-[var(--primary)]/5 p-4 rounded-2xl border-2 border-[var(--primary)]/20 shadow-sm">
                                    <div className="col-span-3 text-[13px] font-bold text-[var(--primary)] border-b border-[var(--primary)]/10 pb-1 mb-1">เรทราคาเช่า (฿)</div>
                                    <div><label className="text-[11px] font-bold text-gray-500">ชม.ละ</label><input type="number" className="w-full border-2 border-white p-2.5 rounded-xl text-[14px] font-black text-[var(--primary)] text-center shadow-sm" value={form.prices.hour} onChange={e=>setForm({...form, prices:{...form.prices, hour:Number(e.target.value)}})} /></div>
                                    <div><label className="text-[11px] font-bold text-gray-500">ยันนอน</label><input type="number" className="w-full border-2 border-white p-2.5 rounded-xl text-[14px] font-black text-purple-500 text-center shadow-sm" value={form.prices.night} onChange={e=>setForm({...form, prices:{...form.prices, night:Number(e.target.value)}})} /></div>
                                    <div><label className="text-[11px] font-bold text-gray-500">ทั้งวัน</label><input type="number" className="w-full border-2 border-white p-2.5 rounded-xl text-[14px] font-black text-orange-500 text-center shadow-sm" value={form.prices.day} onChange={e=>setForm({...form, prices:{...form.prices, day:Number(e.target.value)}})} /></div>
                                </div>
                            ) : (
                                <div className="bg-red-50 p-4 rounded-2xl border-2 border-red-200 shadow-sm flex items-center justify-between">
                                    <label className="text-[13px] font-bold text-red-600"><i className="fa-solid fa-fire"></i> ราคาขายขาด (฿)</label>
                                    <input type="number" className="w-32 border-2 border-white p-2.5 rounded-xl text-[16px] font-black text-red-600 text-right shadow-sm outline-none focus:border-red-300" value={form.prices.sell} onChange={e=>setForm({...form, prices:{...form.prices, sell:Number(e.target.value)}})} />
                                </div>
                            )}

                            <div className="p-4 rounded-2xl bg-blue-50/50 border border-blue-100">
                                <label className="text-[13px] font-bold text-blue-600 block mb-1"><i className="fa-solid fa-hashtag"></i> แท็กสำหรับให้ลูกค้าค้นหา</label>
                                <div className="text-[11px] text-gray-500 font-medium mb-2">พิมพ์คั่นด้วยลูกน้ำ (,) เช่น: ชุดตึง, พันยาม่วง, วีไอพี</div>
                                <input type="text" className="w-full border-2 border-white p-3 rounded-xl text-[13px] font-medium focus:border-blue-300 outline-none shadow-sm" value={tagsInput} onChange={e=>setTagsInput(e.target.value)} />
                            </div>

                            <div>
                                <label className="text-[13px] font-bold text-gray-500 flex items-center gap-2"><i className="fa-regular fa-image"></i> ลิงก์รูปภาพ (หน้าปก)</label>
                                <input type="text" className="w-full border-2 border-gray-100 p-3 rounded-xl text-[12px] mt-1 font-mono bg-gray-50 focus:bg-white focus:border-[var(--primary)] outline-none" value={form.images[0]||''} onChange={e=>setForm({...form, images:[e.target.value]})} />
                                {form.images[0] && <img src={form.images[0]} className="w-20 h-20 mt-2 rounded-xl object-cover border-2 border-pink-100 shadow-sm" />}
                            </div>
                            
                            <div>
                                <label className="text-[13px] font-bold text-gray-500"><i className="fa-solid fa-list"></i> รายละเอียดอื่นๆ หรือ เงื่อนไขเฉพาะรหัสนี้</label>
                                <textarea className="w-full border-2 border-gray-100 p-3 rounded-xl text-[13px] mt-1 font-medium focus:border-[var(--primary)] outline-none leading-relaxed" rows="4" value={form.details} onChange={e=>setForm({...form, details:e.target.value})} />
                            </div>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 w-full mx-auto p-4 bg-white/90 backdrop-blur-md border-t border-pink-100 z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                        <div className="max-w-7xl mx-auto">
                            <button onClick={save} className="w-full py-4 bg-[var(--primary)] text-white font-black text-[15px] rounded-2xl shadow-lg shadow-pink-200 hover:opacity-90 active:scale-95 transition-all flex justify-center items-center gap-2">
                                <i className="fa-solid fa-check"></i> เสร็จสิ้นการแก้ไข (กดเพื่อบันทึกเข้าตาราง)
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
